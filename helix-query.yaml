version: 1

indices:
  pages:
    include:
      - '/**'
    exclude:
      - '/**.json'
    target: /query-index.json
    properties:
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, "content")
      country:
        select: head > meta[name="country"]
        value: attribute(el, "content")
      city:
        select: head > meta[name="city"]
        value: attribute(el, "content")

  # People index — one row per person page, carrying the office relation so
  # office pages can list their people by filtering on `office` (an office id).
  people:
    include:
      - '/people/**'
    exclude:
      - '/people'
    target: /people-index.json
    properties:
      name:
        select: head > meta[name="person-name"]
        value: attribute(el, "content")
      jobTitle:
        select: head > meta[name="job-title"]
        value: attribute(el, "content")
      office:
        select: head > meta[name="office-id"]
        values: attribute(el, "content")
      officeName:
        select: head > meta[name="office-name"]
        value: attribute(el, "content")
      image:
        select: head > meta[name="person-image"]
        value: attribute(el, "content")